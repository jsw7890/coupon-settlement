<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0WCZBQCMQM"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-0WCZBQCMQM');</script><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쿠폰 정산 대조</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">샘플 자료 · 실제 회사 데이터가 아닙니다</p>
      <h1>쿠폰 정산 대조</h1>
      <section class="insight" aria-label="한 줄 결론">
        <p class="insight-label">한 줄 결론</p>
        <p class="insight-text">쿠폰사 정산과 내부 자료를 키로 맞춘 뒤, 금액·수량이 같은 건만 인보이스·전표 초안으로 넘깁니다.</p>
      </section>
      <div class="metrics" role="list">
        <div class="metric"><strong>2</strong><span>입력 파일</span></div>
        <div class="metric"><strong>일치</strong><span>금액·수량 동일</span></div>
        <div class="metric"><strong>로컬</strong><span>브라우저에서 처리</span></div>
      </div>
      <p class="lead">파일을 올린 뒤 정산 대조를 누르면 결과가 나옵니다. 파일이 없으면 샘플 자료로 대조합니다.</p>
      <form id="upload" class="panel upload">
        <div class="upload-fields">
          <label class="file-field">
            <span class="file-title">쿠폰사 정산 파일</span>
            <input id="settlement-file" type="file" accept=".csv,.xlsx,text/csv">
            <span class="file-control">
              <span class="file-button">파일 선택</span>
              <span class="file-name" data-default-name="업체전달샘플_쿠폰사_정산내역.csv">업체전달샘플_쿠폰사_정산내역.csv</span>
            </span>
          </label>
          <label class="file-field">
            <span class="file-title">가맹점 내부 자료</span>
            <input id="internal-file" type="file" accept=".csv,.xlsx,text/csv">
            <span class="file-control">
              <span class="file-button">파일 선택</span>
              <span class="file-name" data-default-name="업체전달샘플_가맹점_내부자료.csv">업체전달샘플_가맹점_내부자료.csv</span>
            </span>
          </label>
        </div>
        <div class="upload-actions">
          <button type="submit" id="sample-run">정산 대조</button>
          <button type="button" id="reset-run" class="secondary">초기화</button>
        </div>
      </form>
    </header>
    <p id="error" class="error" hidden></p>
    <section id="report">
      <p class="muted">대조 전입니다. 위에서 파일을 확인한 뒤 실행하세요.</p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
