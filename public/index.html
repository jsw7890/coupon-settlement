<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쿠폰 정산 대조</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">샘플 자료 · 실제 회사 데이터가 아닙니다</p>
      <h1>쿠폰 정산 대조</h1>
      <p>쿠폰사 정산 자료와 내부 자료를 비교합니다. 금액과 수량이 같은 건만 인보이스와 전표로 만듭니다.</p>
      <form id="upload" class="panel upload">
        <div class="upload-fields">
          <label class="file-field">
            <span class="file-title">쿠폰사 정산 파일</span>
            <input id="settlement-file" type="file" accept=".csv,.xlsx,text/csv" required>
            <span class="file-control">
              <span class="file-button">파일 선택</span>
              <span class="file-name is-empty">선택된 파일 없음</span>
            </span>
            <span class="muted">업체전달샘플_쿠폰사_정산내역.csv</span>
          </label>
          <label class="file-field">
            <span class="file-title">가맹점 내부 자료</span>
            <input id="internal-file" type="file" accept=".csv,.xlsx,text/csv" required>
            <span class="file-control">
              <span class="file-button">파일 선택</span>
              <span class="file-name is-empty">선택된 파일 없음</span>
            </span>
            <span class="muted">업체전달샘플_가맹점_내부자료.csv</span>
          </label>
        </div>
        <button type="submit">올린 파일로 대조</button>
      </form>
    </header>
    <p id="error" class="error" hidden></p>
    <section id="report">
      <p class="muted">파일을 두 칸에 넣은 뒤 ‘올린 파일로 대조’를 누르면 결과가 나옵니다.</p>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
